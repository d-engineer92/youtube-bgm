name: youtube-bgm
x-postgres-image: &postgres-image postgres:18
x-app: &app
  build: .
  image: youtube-bgm-app:local
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /app
  volumes:
    - .:/app
  environment:
    COMPOSER_HOME: /tmp/composer
  depends_on:
    db:
      condition: service_healthy
services:
  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8088"
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "database", "--queue=tracking,default", "--sleep=1", "--timeout=120", "--tries=20"]
    restart: unless-stopped
  db:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_DB: youtube_bgm
      POSTGRES_USER: bgm
      POSTGRES_PASSWORD: "${DB_PASSWORD:-local-bgm-only}"
    volumes:
      - bgm-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgm -d youtube_bgm"]
      interval: 3s
      timeout: 3s
      retries: 20
  db-test:
    image: *postgres-image
    profiles: [test]
    environment:
      POSTGRES_DB: youtube_bgm_test
      POSTGRES_USER: bgm_test_admin
      POSTGRES_PASSWORD: admin-test-only
    volumes:
      - ./docker/postgres-test:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgm_test_admin -d youtube_bgm_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  test:
    <<: *app
    profiles: [test]
    environment:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: db-test
      DB_DATABASE: youtube_bgm_test
      DB_USERNAME: bgm_test
      DB_PASSWORD: test-only
    depends_on:
      db-test:
        condition: service_healthy
    command: ["php", "artisan", "test"]
  test-web:
    <<: *app
    profiles: [test]
    ports:
      - "127.0.0.1:8089:8088"
    environment:
      APP_ENV: testing
      YOUTUBE_MODE: demo
      DB_CONNECTION: pgsql
      DB_HOST: db-test
      DB_DATABASE: youtube_bgm_test
      DB_USERNAME: bgm_test
      DB_PASSWORD: test-only
    depends_on:
      db-test:
        condition: service_healthy
    command: ["php", "artisan", "bgm:browser-test-server"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8088/up') === false ? 1 : 0);"]
      interval: 2s
      timeout: 3s
      retries: 30
  test-worker:
    <<: *app
    profiles: [test]
    environment:
      APP_ENV: testing
      YOUTUBE_MODE: demo
      DB_CONNECTION: pgsql
      DB_HOST: db-test
      DB_DATABASE: youtube_bgm_test
      DB_USERNAME: bgm_test
      DB_PASSWORD: test-only
    depends_on:
      db-test:
        condition: service_healthy
      test-web:
        condition: service_healthy
    command: ["php", "artisan", "bgm:browser-test-worker"]
  browser:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/browser-tests/Dockerfile
    image: youtube-bgm-browser:local
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/app:ro
      - /tmp/bgm-exploration:/evidence
    environment:
      BGM_URL: http://test-web:8088/
      BGM_EVIDENCE: /evidence
    depends_on:
      test-web:
        condition: service_healthy
    command: ["node", "tests/browser/exploration.cjs"]
volumes:
  bgm-db:
